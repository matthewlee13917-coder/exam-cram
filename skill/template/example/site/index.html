<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo: Macro finals cram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e6; --sheet:#fbf8f2; --ink:#1c2230; --ink2:#4a5162; --rule:#ddd3c1; --rule2:#e9e1d2;
  --red:#b83a26; --redbg:#f6e3dc; --ok:#2d6a45; --okbg:#e1eee3;
  --acc:#2c4a86; --accbg:#e3e9f4;
  --serif:'Newsreader',Georgia,serif; --sans:'Public Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scrollbar-color:var(--rule) var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--accbg);color:var(--ink)}
a{color:var(--acc);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:650;letter-spacing:-0.01em;text-wrap:balance;margin:0}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.45rem;margin:2.2rem 0 .7rem}
h3{font-size:1.1rem;margin:1.6rem 0 .45rem}
p{margin:.5rem 0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{background:var(--sheet);border-bottom:1px solid var(--rule);padding:22px 0 0}
.toprow{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap}
.sub{color:var(--ink2);font-size:.95rem;margin-top:4px}
.exams{display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:0;margin-top:18px;border-top:1px solid var(--rule)}
.exam{all:unset;cursor:pointer;padding:14px 18px 14px 0;border-bottom:3px solid transparent;display:block}
.exam+.exam{padding-left:18px;border-left:1px solid var(--rule)}
.exam .code{font-family:var(--serif);font-size:1.25rem;font-weight:650}
.exam .meta{font-size:.88rem;color:var(--ink2)}
.exam .cd{font-family:var(--mono);font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.exam[aria-selected=true]{border-bottom-color:var(--acc)}
.exam:hover .code{text-decoration:underline;text-underline-offset:4px}
nav.views{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
nav.views .wrap{display:flex;gap:4px;overflow-x:auto}
nav.views button{all:unset;cursor:pointer;padding:12px 14px;font-weight:600;font-size:.93rem;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.views button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
nav.views button:hover{color:var(--ink)}
main{padding:10px 0 80px}
.lead{font-size:1.05rem;max-width:70ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.box h3:first-child{margin-top:0}
.in li::marker{color:var(--ok)} .out li::marker{color:var(--red)}
ul{padding-left:1.2rem;margin:.4rem 0} li{margin:.25rem 0}
.tag{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:99px;vertical-align:middle}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vid{display:flex;flex-direction:column;gap:5px;padding:14px 16px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);text-decoration:none;color:var(--ink);transition:border-color .15s}
.vid:hover{border-color:var(--acc)}
.vid .vt{font-weight:700;line-height:1.35}
.vid .vt::after{content:' ↗';color:var(--acc)}
.vid .vc{font-size:.84rem;color:var(--ink2)}
.vid .vw{font-size:.92rem}
.vid .vwarn{font-size:.85rem;color:var(--red)}
@media (max-width:760px){.vids{grid-template-columns:1fr}}
.t-in{background:var(--okbg);color:var(--ok)} .t-out{background:var(--redbg);color:var(--red)} .t-acc{background:var(--accbg);color:var(--acc)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden;margin:16px 0}
.facts div{padding:12px 14px;border-right:1px solid var(--rule2)} .facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--serif);font-size:1.15rem}
.facts span{font-size:.82rem;color:var(--ink2)}
/* cram */
.chap{margin-top:8px}
.chap>h2 small{display:block;font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--ink2);margin-top:2px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:6px 22px 16px}
.sheet h3{color:var(--acc)}
.f{font-family:var(--mono);font-size:.9rem;background:#f1ebdf;border:1px solid var(--rule2);border-radius:6px;padding:8px 12px;margin:8px 0;overflow-x:auto;white-space:pre-wrap}
.sym{font-size:.86rem;color:var(--ink2)}
.trap{background:var(--redbg);color:#5d1d12;border-radius:8px;padding:9px 13px;margin:10px 0;font-size:.93rem}
.trap b{color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--rule2);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink2);font-size:.82rem}
/* worked */
details.we{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;margin:12px 0;padding:0}
details.we summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.we summary::-webkit-details-marker{display:none}
details.we summary::after{content:'Show steps';font-size:.8rem;color:var(--acc);white-space:nowrap}
details.we[open] summary::after{content:'Hide'}
details.we .body{padding:0 18px 16px;border-top:1px solid var(--rule2)}
.src{font-size:.8rem;color:var(--ink2)}
/* practice */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.chip{all:unset;cursor:pointer;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 12px;font-size:.86rem;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip:hover{border-color:var(--acc)}
.btn{all:unset;cursor:pointer;background:var(--acc);color:#fff;font-weight:700;padding:10px 18px;border-radius:8px;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:default}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;max-width:820px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--ink2);margin-bottom:10px}
.qtext{font-size:1.07rem;font-weight:500;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:#fffdf9;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--acc)}
.opt .l{font-family:var(--mono);font-weight:600;color:var(--ink2);padding-top:1px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .l{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--redbg)} .opt.wrong .l{color:var(--red)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.fb .verdict{font-weight:700}
.fb .verdict.r{color:var(--ok)} .fb .verdict.w{color:var(--red)}
.note{background:#efe7d6;border-radius:8px;padding:9px 13px;margin:8px 0;font-size:.92rem}
.rowbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--ink2)}
.kbd{font-family:var(--mono);font-size:.75rem;border:1px solid var(--rule);border-radius:4px;padding:0 5px;background:var(--sheet)}
/* mock */
.mockbar{position:sticky;top:45px;z-index:4;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);gap:12px;flex-wrap:wrap}
.timer{font-family:var(--mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.mq{margin:18px 0;max-width:820px}
.mq .qtext{font-size:1rem}
textarea{width:100%;min-height:150px;font:15px/1.5 var(--sans);padding:12px;border:1px solid var(--rule);border-radius:8px;background:#fffdf9;color:var(--ink);resize:vertical}
.sa{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin:18px 0;max-width:860px}
.sa .pts{font-family:var(--mono);font-size:.85rem;color:var(--acc);font-weight:600}
.model{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.rub label{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.94rem;cursor:pointer}
.rub input{margin-top:4px;accent-color:var(--acc)}
.result{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin:16px 0}
.big{font-family:var(--serif);font-size:2.4rem;font-weight:650;line-height:1}
.plan td:first-child{white-space:nowrap;font-weight:600;font-family:var(--mono);font-size:.85rem}
.empty{color:var(--ink2);padding:30px 0}
.hide{display:none!important}
@media (max-width:760px){
  .cols{grid-template-columns:1fr}
  .exam+.exam{padding-left:10px;border-left:1px solid var(--rule);border-top:0}
  .exams{grid-template-columns:repeat(var(--n,1),1fr)!important} .exam{padding:10px 8px 10px 0} .exam .meta{display:none} .exam .code{font-size:.98rem} .exam .cd{font-size:.72rem}
  .facts{grid-template-columns:1fr 1fr} .facts div:nth-child(2){border-right:0}
  .qcard{padding:18px}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .28s cubic-bezier(.16,1,.3,1)}
  @keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <div class="toprow"><div><h1 id="title"></h1><div class="sub" id="sub"></div></div></div>

</header>

    <button data-view="worked">Worked examples</button>
    <button data-view="practice">Practice</button>
    <button data-view="mock">Timed mock</button>
    <button data-view="videos">Videos</button>
    <button data-view="plan">Plan</button>
  </div>
</nav>

<main class="wrap" id="main"></main>

s, then falls", "It falls"], "a": 3, "ex": "Discouraged workers leave the labour force, so they drop out of both the unemployed count and the labour force. The measured rate falls even though no one found a job."}, {"id": "E101-5", "course": "ECON101", "ch": 2, "topic": "Real interest rate", "kind": "clone", "src": "Demo slides Ch 2", "based": "Ch 2 slide \"Real vs nominal\"", "q": "A savings account pays 4% a year and inflation is 6%. What is the approximate real interest rate?", "o": ["−2%", "10%", "2%", "−10%"], "a": 0, "ex": "Real rate ≈ nominal rate − inflation = 4% − 6% = −2%. The saver's purchasing power shrinks."}, {"id": "E101-6", "course": "ECON101", "ch": 2, "topic": "Winners and losers", "kind": "clone", "src": "Demo slides Ch 2", "based": "Ch 2 slide \"Unexpected inflation redistributes\"", "q": "Inflation turns out much higher than lenders and borrowers expected when a fixed-rate loan was signed. Who gains?", "o": ["The lender", "The borrower", "Neither, because the nominal rate adjusts", "Both, because incomes rise"], "a": 1, "ex": "The borrower repays in dollars that buy less than expected, so the real interest rate paid is lower than planned. The lender loses."}, {"id": "E101-7", "course": "ECON101", "ch": 3, "topic": "Quantity theory", "kind": "clone", "src": "Demo slides Ch 3", "based": "Ch 3 slide \"MV = PY\"", "q": "If velocity is constant and real output grows 2% a year, what money-growth rate keeps the price level stable?", "o": ["0%", "2%", "1%", "4%"], "a": 1, "ex": "In growth rates, %ΔM + %ΔV = %ΔP + %ΔY. With %ΔV = 0 and %ΔY = 2%, %ΔP = 0 needs %ΔM = 2%."}, {"id": "E101-8", "course": "ECON101", "ch": 3, "topic": "Functions of money", "kind": "clone", "src": "Demo slides Ch 3", "based": "Ch 3 slide \"What money does\"", "q": "Prices in a store are posted in dollars. Which function of money does this show?", "o": ["Medium of exchange", "Store of value", "Unit of account", "Standard of deferred payment"], "a": 2, "ex": "Posting prices in dollars uses money as the common measuring stick: unit of account. Paying with it is medium of exchange."}, {"id": "E201-1", "course": "ECON201", "ch": 4, "topic": "Natural rate", "kind": "clone", "src": "Demo slides Ch 4", "based": "Ch 4 slide \"Steady-state unemployment\"", "q": "Each month 2% of employed workers lose their jobs and 23% of unemployed workers find one. What is the steady-state unemployment rate?", "o": ["2.0%", "8.7%", "25.0%", "8.0%"], "a": 3, "ex": "In steady state u = s / (s + f) = 0.02 / (0.02 + 0.23) = 0.02 / 0.25 = 8%.", "trap": "0.02 / 0.23 = 8.7% forgets to add the separation rate to the bottom."}, {"id": "E201-2", "course": "ECON201", "ch": 4, "topic": "Okun's law", "kind": "clone", "src": "Demo slides Ch 4", "based": "Ch 4 slide \"Okun's law\"", "q": "Okun's coefficient is 2. Unemployment is 2 points above its natural rate. By roughly how much is output below potential?", "o": ["4%", "1%", "2%", "8%"], "a": 0, "ex": "Output gap ≈ −2 × (u − u*) = −2 × 2 = −4%. Output is about 4% below potential."}, {"id": "E201-3", "course": "ECON201", "ch": 4, "topic": "Hysteresis", "kind": "clone", "src": "Demo slides Ch 4", "based": "Ch 4 slide \"Hysteresis\"", "q": "After a long recession, the natural rate of unemployment stays higher than before. What is this called?", "o": ["Stagflation", "Hysteresis", "The sacrifice ratio", "Crowding out"], "a": 1, "ex": "Hysteresis: a long spell of high actual unemployment raises the natural rate itself, for example because skills decay."}, {"id": "E201-4", "course": "ECON201", "ch": 5, "topic": "Costs of anticipated inflation", "kind": "clone", "src": "Demo slides Ch 5", "based": "Ch 5 slide \"Costs even when inflation is expected\"", "q": "Restaurants reprinting their menus every month because of steady, fully expected inflation is an example of:", "o": ["Shoe-leather costs", "Redistribution from lenders to borrowers", "Menu costs", "The inflation tax"], "a": 2, "ex": "Menu costs are the real resources spent changing <h3>Rates</h3>${F('u = unemployed / labour force\nlabour force = employed + unemployed\nparticipation = labour force / adult population','u is the unemployment rate. Adults not working and not looking are outside the labour force: they are in neither count.')}

<div class="chap"><h2>Ch 3 Money<small>Functions and the quantity theory</small></h2><div class="sheet">${F('M × V = P × Y\n%ΔM + %ΔV = %ΔP + %ΔY','M is the money supply, V velocity, P the price level, Y real output.')}</div></div>`,

},

<div class="cols"><div class="box in"><h3><span class="tag t-in">In scope</span></h3><ul><li><b>Ch 4:</b> steady-state unemployment, Okun's law, hysteresis.</li><li><b>Ch 5:</b> costs of anticipated inflation, taxing nominal interest, bond prices.</li><li><b>Ch 6:</b> expectations-augmented and long-run Phillips curve.</li></ul></div>
<div class="box out"><h3><span class="tag t-out">Not on this exam</span></h3><ul><li>Ch 7 open economy (cut in the scope announcement).</li></ul></div></div>`,

<div class="chap"><h2>Ch 5 Inflation &amp; bonds<small>Taxes and present value</small></h2><div class="sheet">${F('after-tax real return = i(1 − t) − π\nprice of zero-coupon bond = FV / (1 + i)ⁿ','t is the tax rate on interest, FV the face value, n years to maturity.')}<div class="trap"><b>Trap:</b> divide by 1.05, don't multiply by 0.95.</div></div></div>
<div class="chap"><h2>Ch 6 Phillips curve<small>Short run and long run</small></h2><div class="sheet">${F('π = πᵉ − β(u − u*)','πᵉ is expected inflation, β how strongly inflation responds to slack.')}</div></div>`,

  model:'<p>In the short run, surprise inflation pushes u below u*. Workers then raise πᵉ, which shifts the short-run curve up. To hold u below u*, inflation must keep beating expectations, so it accelerates. Once πᵉ = π, u returns to u*: the long-run curve is vertical.</p>',
  rub:['States the equation π = πᵉ − β(u − u*)','Short run: surprise inflation lowers u','Expectations rise and the curve shifts up','Holding u < u* needs ever-rising inflation','Long run: πᵉ = π so u = u*','Long-run curve is vertical at u*']}
],

};
CONTENT.all = {
scope: `<h2>One exam, three topics</h2><p class="lead">Both demo courses teach the same ideas at two levels, so this view merges them into <b>three shared topics</b>. Every item is tagged with its exam.</p>
<table><tr><th>Topic</th><th>Questions</th></tr><tr><td>Unemployment &amp; the labour market</td><td data-count="labour"></td></tr><tr><td>Inflation, interest &amp; bonds</td><td data-count="inflation"></td></tr><tr><td>Money &amp; the Phillips curve</td><td data-count="money"></td></tr></table>
<div class="trap"><b>Same idea, different number:</b> ECON 101 uses r ≈ i − π; ECON 201 also subtracts tax: i(1 − t) − π.</div>`,
cram: CONTENT.ECON101.cram + CONTENT.ECON201.cram,
worked: [['labour', CONTENT.ECON101.worked[0], 'ECON101'], ['labour', CONTENT.ECON201.worked[0], 'ECON201'], ['inflation', CONTENT.ECON201.worked[1], 'ECON201'], ['money', CONTENT.ECON101.worked[1], 'ECON101']],

};

// Every id here was checked with tools/yt_verify.py.
const VIDEOS = {
labour: [
 {id:'9i6vf5Wz6nY', t:'Unemployment (Macro Topic 2.3)', ch:'Jacob Clifford', ex:['ECON101'], why:'Who counts as unemployed and how the rate is calculated. Start here.', warn:'U.S. survey definitions; your country\'s labour survey may differ on age cut-offs.'},
 {id:'b6z22dRkjCg', t:'Structural and Frictional Unemployment (Natural Rate)', ch:'EconplusDal', ex:['ECON101','ECON201'], why:'The two parts of the natural rate, with clear examples.'}
],

 {id:'TI9L4MLAboc', t:'The Cost of Inflation (Menu, Shoe-Leather, Unit of Account)', ch:'Econbusters', ex:['ECON201'], why:'The costs that exist even when inflation is expected.'},

 {id:'I7FDx4DPapw', t:'Relationship between bond prices and interest rates', ch:'Khan Academy', ex:['ECON201'], why:'Why bond prices fall when rates rise.'}
],

<script>
(function(){
// exam-cram study page engine. Everything course-specific comes from CONFIG, CONTENT, VIDEOS and the bank.
const BANK = JSON.parse(document.getElementById('bank').textContent);
const EX = CONFIG.exams, EXID = EX.map(e=>e.id), BYID = Object.fromEntries(EX.map(e=>[e.id,e]));
const COMBINED = EX.length > 1 && CONFIG.combined;
const THEMES = COMBINED ? CONFIG.combined.themes : [];
const THEMENAME = Object.fromEntries(THEMES.map(t=>[t.id,t.name]));
const themeOf = q => q.theme || (CONFIG.combined && CONFIG.combined.map && (CONFIG.combined.map[q.course]||{})[q.ch]) || (THEMES[0]||{}).id;
const UNITS = id => Object.keys(BYID[id].units).map(k=>isNaN(+k)?k:+k);
const CH = Object.assign({all: THEMES.map(t=>t.id)}, Object.fromEntries(EXID.map(id=>[id, UNITS(id)])));
const chName = (c, ch) => (BYID[c] && BYID[c].units[ch]) || ('Ch '+ch);
const unitOf = q => course==='all' ? themeOf(q) : q.ch;
const unitName = u => course==='all' ? THEMENAME[u] : chName(course, u);
const L = ['A','B','C','D'];
const main = document.getElementById('main');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
const EXTAG = c => `<span class="tag t-${slug(c)}">${esc(BYID[c]?BYID[c].code:c)}</span>`;
window.EXTAG = EXTAG;

// ---- header + per-exam colours, built from CONFIG ----
document.title = CONFIG.title;
document.getElementById('title').textContent = CONFIG.title;
document.getElementById('sub').innerHTML = CONFIG.sub || '';
const tint = c => `color-mix(in srgb, ${c} 13%, #fff)`;
const allColor = (COMBINED && CONFIG.combined.color) || '#7a3b2e';
let css = `body.c-all{--acc:${allColor};--accbg:${tint(allColor)}}`;
EX.forEach(e=>{ const s=slug(e.id); css += `body.c-${s}{--acc:${e.color};--accbg:${tint(e.color)}} .t-${s}{background:${tint(e.color)};color:${e.color}}`; });
document.getElementById('examcss').textContent = css;
const tabs = (COMBINED ? [{id:'all', code:CONFIG.combined.name||'Study as one', meta:CONFIG.combined.meta||'', when:EX.map(e=>e.when).sort()[0]}] : []).concat(EX);
const exEl = document.getElementById('exams');
exEl.style.setProperty('--n', tabs.length);
exEl.innerHTML = tabs.map(t=>`<button class="exam" role="tab" data-course="${esc(t.id)}" aria-selected="false"><div class="code">${esc(t.code)}${t.name?' · '+esc(t.name):''}</div><div class="meta">${esc(t.meta||'')}</div>${t.when?`<div class="cd" data-cd="${esc(t.when)}"></div>`:''}</button>`).join('');

// ---- storage (optional) ----
const KEY = CONFIG.storeKey || 'examcram-'+slug(CONFIG.title);
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e) { store = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };
store.stats = store.stats || {};
function record(id, ok){ const s = store.stats[id] || {r:0,w:0}; ok ? s.r++ : s.w++; s.last = ok; store.stats[id]=s; save(); }

let course = COMBINED ? 'all' : EXID[0], view = 'scope';
let pr = null, mock = null, timerId = null;

function tick(){
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const ms = new Date(el.dataset.cd) - new Date();
    if (isNaN(ms)) { el.textContent=''; return; }
    if (ms <= 0) { el.textContent = 'Exam time has passed'; return; }
    const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4);
    el.textContent = (h>=24 ? Math.floor(h/24)+'d '+(h%24)+'h ' : h+'h ') + m + 'm to go';
  });
}
tick(); setInterval(tick, 30000);

const VIEWS = ['scope','cram','worked','practice','mock','videos','plan'];
function setHash(){ const h = slug(course)+'-'+view; if (location.hash.slice(1)!==h) history.replaceState(null,'','#'+h); }
function readHash(){
  const h = location.hash.slice(1), i = h.lastIndexOf('-'); if (i<0) return;
  const c = h.slice(0,i), v = h.slice(i+1);
  const id = c==='all' && COMBINED ? 'all' : EXID.find(x=>slug(x)===c);
  if (id && VIEWS.includes(v)) { if (id!==course) { pr=null; mock=null; stopTimer(); } course = id; view = v; }
}
function chrome(){
  document.body.className = 'c-'+slug(course);
  document.querySelectorAll('.exam').forEach(b=>b.setAttribute('aria-selected', b.dataset.course===course));
  document.querySelectorAll('nav.views button').forEach(b=>b.setAttribute('aria-selected', b.dataset.view===view));
}
const C = () => CONTENT[course] || {};
function render(){
  chrome(); setHash();
  if (view !== 'mock') stopTimer();
  if (view==='scope') {
    main.innerHTML = '<div class="view">'+(C().scope||'')+'</div>';
    main.querySelectorAll('[data-count]').forEach(td=>{ const ids=BANK.filter(q=>themeOf(q)===td.dataset.count); td.textContent = EX.map(e=>ids.filter(q=>q.course===e.id).length+' '+e.code).join(' · '); });
  }
  else if (view==='cram') main.innerHTML = '<div class="view">'+(C().cram||'')+'</div>';
  else if (view==='plan') main.innerHTML = '<div class="view">'+(C().plan || (CONTENT.all&&CONTENT.all.plan) || '<p class="empty">No plan yet.</p>')+'</div>';
  else if (view==='videos') renderVideos();
  else if (view==='worked') renderWorked();
  else if (view==='practice') renderPractice();
  else if (view==='mock') renderMock();
  window.scrollTo({top:0});
}
document.querySelectorAll('.exam').forEach(b=>b.addEventListener('click',()=>{ if(course!==b.dataset.course){course=b.dataset.course; pr=null; mock=null;} render(); }));
document.querySelectorAll('nav.views button').forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.view; render(); }));
window.addEventListener('hashchange',()=>{ readHash(); render(); });

const weCard = (w, tag) => `<details class="we"><summary><span>${tag||''} ${w.t}<br><span class="src">${w.s||''}</span></span></summary><div class="body">${w.b}</div></details>`;
function renderWorked(){
  let h = '<div class="view"><h2>Worked examples</h2>';
  if (course==='all') {
    h += '<p class="lead">Grouped by topic. Try each on paper first, then open the steps. The tag shows which exam the example comes from.</p>';
    THEMES.forEach(t=>{ const W = (CONTENT.all.worked||[]).filter(w=>w[0]===t.id); if (W.length) h += `<h3>${t.name}</h3>` + W.map(([_,w,c])=>weCard(w, EXTAG(c))).join(''); });
  } else {
    h += '<p class="lead">Try each one on paper first, then open the steps. These are the professor\'s own examples or direct clones of them, the most likely sources of exam items.</p>' + (C().worked||[]).map(w=>weCard(w)).join('');
  }
  main.innerHTML = h + '</div>';
}

function renderVideos(){
  const groups = course==='all' || !CONFIG.videoGroups ? (COMBINED ? THEMES : (CONFIG.videoGroups||[])) : CONFIG.videoGroups;
  const fits = v => course==='all' || !v.ex || v.ex.includes(course);
  let h = '<div class="view"><h2>Video lessons</h2><p class="lead">Short lessons for each topic, in watching order. The first video per topic is the one to watch if you only have time for one. Links open on YouTube.</p>';
  if (CONFIG.videosWarning) h += `<div class="trap">${CONFIG.videosWarning}</div>`;
  let any = false;
  groups.forEach(t=>{
    const vs = (VIDEOS[t.id]||[]).filter(fits); if (!vs.length) return; any = true;
    h += `<h3>${t.name}</h3><div class="vids">` + vs.map((v,i)=>`<a class="vid" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener noreferrer"><span class="vt">${i===0?'<span class="tag t-in">Watch first</span> ':''}${esc(v.t)}</span><span class="vc">${esc(v.ch)}${v.ex?' · '+v.ex.map(EXTAG).join(' '):''}</span><span class="vw">${esc(v.why)}</span>${v.warn?`<span class="vwarn">${esc(v.warn)}</span>`:''}</a>`).join('') + '</div>';
  });
  if (!any) h += '<p class="empty">No verified videos for this exam.</p>';
  main.innerHTML = h + (CONFIG.videosChecked?`<p class="src">${CONFIG.videosChecked}</p>`:'') + '</div>';
}

// ---------------- Practice ----------------
const inCourse = q => course==='all' || q.course===course;
function pool(){
  return BANK.filter(q=>inCourse(q) && pr.chs.has(unitOf(q)) && (course!=='all'||pr.ex==='both'||q.course===pr.ex) && (pr.src==='all'||q.kind===pr.src) && (!pr.misses || (store.stats[q.id] && store.stats[q.id].last===false)));
}
function prepare(q){
  // real questions keep their original letters; clones shuffle unless an option refers to other options
  const idx = [0,1,2,3];
  const fixed = q.kind==='real' || q.o.some(o=>/above|both|neither|a and b/i.test(o));
  return {q, order: fixed ? idx : shuffle(idx)};
}
function newQueue(){ pr.queue = shuffle(pool()).map(prepare); pr.i=0; pr.right=0; pr.done=0; pr.answered=null; }
function renderPractice(){
  if (!pr) { pr = {chs:new Set(CH[course]), src:'all', ex:'both', misses:false}; newQueue(); }
  const nMiss = BANK.filter(q=>inCourse(q) && store.stats[q.id] && store.stats[q.id].last===false).length;
  const counts = {all:0, real:0, clone:0}; BANK.forEach(q=>{ if(inCourse(q)){counts.all++; counts[q.kind]++;} });
  let h = '<div class="view"><h2>Practice</h2>';
  h += '<div class="toolbar" role="group" aria-label="Topics">'+CH[course].map(c=>`<button class="chip" data-ch="${esc(c)}" aria-pressed="${pr.chs.has(c)}">${esc(unitName(c))}</button>`).join('')+'</div>';
  if (course==='all') h += '<div class="toolbar" role="group" aria-label="Exam">'+[['both','All exams']].concat(EX.map(e=>[e.id, e.code+' only'])).map(([k,l])=>`<button class="chip" data-ex="${esc(k)}" aria-pressed="${pr.ex===k}">${esc(l)}</button>`).join('')+'</div>';
  h += '<div class="toolbar" role="group" aria-label="Source">'+
    (counts.real && counts.clone ? `<button class="chip" data-src="all" aria-pressed="${pr.src==='all'}">All ${counts.all}</button><button class="chip" data-src="real" aria-pressed="${pr.src==='real'}">${esc(CONFIG.realLabel||'Real past-exam')} ${counts.real}</button><button class="chip" data-src="clone" aria-pressed="${pr.src==='clone'}">${esc(CONFIG.cloneLabel||'Written from your notes')} ${counts.clone}</button>`
      : `<span class="src">${counts.all} questions${counts.real?', all from real past exams':', each modelled on a worked example or slide from your course'}.</span>`)+
    `<button class="chip" data-miss="1" aria-pressed="${pr.misses}">My misses (${nMiss})</button></div>`;
  h += '<div id="qzone"></div></div>';
  main.innerHTML = h;
  main.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{ pr.ex=b.dataset.ex; newQueue(); renderPractice(); });
  main.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const c = CH[course].find(x=>String(x)===b.dataset.ch); if(pr.chs.has(c)&&pr.chs.size>1) pr.chs.delete(c); else pr.chs.add(c); newQueue(); renderPractice(); });
  main.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{ pr.src=b.dataset.src; newQueue(); renderPractice(); });
  main.querySelectorAll('[data-miss]').forEach(b=>b.onclick=()=>{ pr.misses=!pr.misses; newQueue(); renderPractice(); });
  drawQ();
}
function metaLine(q){
  return `<div class="qmeta">${course==='all'?EXTAG(q.course):''}<span class="tag t-acc">${esc(chName(q.course,q.ch))}</span><span>${esc(q.topic)}</span>`+
   (q.kind==='real' ? `<span class="tag t-in">Real: ${esc(q.src)}</span>` : `<span class="tag" style="background:#efe7d6">Modelled on ${esc(q.based||q.src)}</span>`)+'</div>';
}
function drawQ(){
  const z = document.getElementById('qzone');
  if (!pr.queue.length) { z.innerHTML = '<p class="empty">'+(pr.misses?'No misses left in this selection. Nice.':'No questions match these filters.')+'</p>'; return; }
  if (pr.i >= pr.queue.length) {
    const pct = Math.round(100*pr.right/Math.max(1,pr.done));
    z.innerHTML = `<div class="result"><div class="big">${pr.right}/${pr.done}</div><p>${pct}% this round. ${pct>=85?'Ready for a timed mock.':'Switch on “My misses” and run it again.'}</p><div class="rowbtns"><button class="btn" id="again">New round</button></div></div>`;
    document.getElementById('again').onclick=()=>{ newQueue(); drawQ(); };
    return;
  }
  const {q, order} = pr.queue[pr.i];
  let h = `<div class="qcard">${metaLine(q)}<div class="qtext">${esc(q.q)}</div><div class="opts">`;
  order.forEach((oi,pos)=>{ h += `<button class="opt" data-oi="${oi}"><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`; });
  h += `</div><div id="fb"></div><div class="rowbtns"><span class="score">${pr.i+1} of ${pr.queue.length} · ${pr.right}/${pr.done} right</span><span class="src">Keys <span class="kbd">A</span>–<span class="kbd">D</span> answer, <span class="kbd">Enter</span> next</span></div></div>`;
  z.innerHTML = h;
  z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.oi));
}
function answer(oi){
  if (pr.answered!==null) return;
  const {q} = pr.queue[pr.i]; pr.answered = oi;
  const ok = oi===q.a; pr.done++; if(ok) pr.right++; record(q.id, ok);
  document.querySelectorAll('#qzone .opt').forEach(b=>{ const k=+b.dataset.oi; b.disabled=true; if(k===q.a) b.classList.add('right'); else if(k===oi) b.classList.add('wrong'); });
  let f = `<div class="fb"><div class="verdict ${ok?'r':'w'}">${ok?'Correct':'Not quite'}</div><p>${esc(q.ex)}</p>`;
  if (q.trap) f += `<div class="trap"><b>Trap:</b> ${esc(q.trap)}</div>`;
  if (q.note) f += `<div class="note"><b>Note:</b> ${esc(q.note)}</div>`;
  f += `<p class="src">Source: ${esc(q.src)}${q.based?' · modelled on '+esc(q.based):''}</p><div class="rowbtns"><button class="btn" id="next">Next question</button></div></div>`;
  document.getElementById('fb').innerHTML = f;
  document.getElementById('next').onclick = next;
  document.getElementById('next').focus({preventScroll:true});
}
function next(){ pr.i++; pr.answered=null; drawQ(); }
document.addEventListener('keydown', e=>{
  if (view!=='practice' || !pr || e.metaKey || e.ctrlKey || e.altKey || /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (pr.answered===null && ['a','b','c','d','1','2','3','4'].includes(k)) {
    const pos = 'abcd'.includes(k) ? 'abcd'.indexOf(k) : +k-1;
    const item = pr.queue[pr.i]; if (item) answer(item.order[pos]);
  } else if (pr.answered!==null && (k==='enter'||k==='arrowright')) { e.preventDefault(); next(); }
});

// ---------------- Mock ----------------
// exam.mock = {mins, pts, quota:{ch:n}, sa:[points...], desc}; combined.mix = {mins, quota:{themeId:n}, desc}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
const mockCfg = k => k==='mix' ? Object.assign({pts:1}, CONFIG.combined.mix) : Object.assign({pts:1}, BYID[k].mock);
function buildMock(kind){
  const cfg = mockCfg(kind), qs = [];
  for (const [u,n] of Object.entries(cfg.quota||{})) {
    const p = BANK.filter(q=> kind==='mix' ? themeOf(q)===u : (q.course===kind && String(q.ch)===u));
    qs.push(...shuffle(p).slice(0,n));
  }
  const items = shuffle(qs).map(prepare);
  const SA = kind==='mix' ? [] : ((CONTENT[kind]||{}).sa||[]);
  const sas = (cfg.sa||[]).map(p=>shuffle(SA.filter(s=>s.pts===p))[0]).filter(Boolean);
  return {kind, cfg, items, sas, picks:{}, notes:{}, rub:{}, mins:cfg.mins, end: Date.now()+cfg.mins*60*1000, submitted:false};
}
function renderMock(){
  if (!mock) {
    const kinds = course==='all' ? ['mix'].concat(EXID) : [course];
    main.innerHTML = `<div class="view"><h2>Timed mock</h2><p class="lead">${esc(CONFIG.mockAids||'Exam conditions.')} No feedback until you submit.</p>` + kinds.map(k=>{ const c=mockCfg(k); return `<div class="box" style="margin:14px 0"><p>${c.desc||''}</p><div class="rowbtns"><button class="btn${k===kinds[0]?'':' ghost'}" data-start="${esc(k)}">Start (${c.mins} min)</button></div></div>`; }).join('') + '</div>';
    main.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{ mock=buildMock(b.dataset.start); renderMock(); });
    return;
  }
  const mcPts = mock.cfg.pts;
  let h = `<div class="view"><div class="mockbar"><span class="timer" id="timer"></span><span class="score" id="prog"></span><button class="btn" id="submit">${mock.submitted?'New mock':'Submit and mark'}</button></div>`;
  if (mock.submitted) h += resultBox();
  h += `<h2>Part A: multiple choice <small class="src">(${mock.items.length} × ${mcPts})</small></h2>`;
  mock.items.forEach(({q,order},n)=>{
    const pick = mock.picks[q.id];
    h += `<div class="mq qcard" id="m${n}">${mock.submitted?metaLine(q):''}<div class="qtext">${n+1}. ${esc(q.q)}</div><div class="opts">`;
    order.forEach((oi,pos)=>{
      let cls = 'opt';
      if (mock.submitted) { if (oi===q.a) cls+=' right'; else if (oi===pick) cls+=' wrong'; }
      else if (oi===pick) cls+=' sel';
      h += `<button class="${cls}" data-q="${esc(q.id)}" data-oi="${oi}" ${mock.submitted?'disabled':''}><span class="l">${L[pos]}</span><span>${esc(q.o[oi])}</span></button>`;
    });
    h += '</div>';
    if (mock.submitted) h += `<div class="fb"><p>${esc(q.ex)}</p>${q.note?`<div class="note"><b>Note:</b> ${esc(q.note)}</div>`:''}</div>`;
    h += '</div>';
  });
  if (mock.sas.length) {
    h += '<h2>Part B: written answers</h2>';
    mock.sas.forEach((s,k)=>{
      h += `<div class="sa"><div class="pts">${s.pts} points · ${esc(s.t)}</div><div>${s.q}</div>`;
      h += `<textarea data-sa="${k}" placeholder="Answer here or on paper. Full sentences, every step." ${mock.submitted?'readonly':''}>${esc(mock.notes[k]||'')}</textarea>`;
      if (mock.submitted) h += `<div class="model"><h3>Model answer</h3>${s.model}<h3>Mark yourself</h3><div class="rub">`+ s.rub.map((r,j)=>`<label><input type="checkbox" data-rub="${k}-${j}" ${mock.rub[k+'-'+j]?'checked':''}> <span>${esc(r)}</span></label>`).join('')+ `</div><p class="src">Built from: ${esc(s.based)}</p></div>`;
      h += '</div>';
    });
  }
  main.innerHTML = h + '</div>';
  main.querySelectorAll('.opt[data-q]').forEach(b=>b.onclick=()=>{ mock.picks[b.dataset.q]=+b.dataset.oi; b.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===b)); prog(); });
  main.querySelectorAll('textarea[data-sa]').forEach(t=>t.oninput=()=>{ mock.notes[t.dataset.sa]=t.value; });
  main.querySelectorAll('input[data-rub]').forEach(c=>c.onchange=()=>{ mock.rub[c.dataset.rub]=c.checked; const r=document.getElementById('res'); if(r) r.outerHTML=resultBox(); });
  document.getElementById('submit').onclick=()=>{
    if (mock.submitted) { mock=null; renderMock(); return; }
    const left = mock.items.filter(({q})=>mock.picks[q.id]===undefined).length;
    const b = document.getElementById('submit');
    if (left && !b.dataset.confirm) { b.dataset.confirm='1'; b.textContent=`${left} unanswered: submit anyway?`; return; }
    finish();
  };
  prog(); startTimer();
}
function prog(){ const p=document.getElementById('prog'); if(p&&mock) p.textContent = Object.keys(mock.picks).length+'/'+mock.items.length+' answered'; }
function startTimer(){
  stopTimer();
  const t = document.getElementById('timer');
  const upd = ()=>{
    if (!mock || !t) return;
    if (mock.submitted) { t.textContent = 'Marked'; t.classList.remove('low'); return; }
    const ms = mock.end - Date.now();
    if (ms <= 0) { t.textContent = '0:00'; finish(); return; }
    const m = Math.floor(ms/6e4), s = Math.floor(ms%6e4/1000);
    t.textContent = m+':'+String(s).padStart(2,'0'); t.classList.toggle('low', ms < 10*6e4);
  };
  upd(); timerId = setInterval(upd, 1000);
}
function finish(){
  stopTimer(); mock.submitted = true;
  mock.items.forEach(({q})=>record(q.id, mock.picks[q.id]===q.a));
  mock.usedMin = Math.round((mock.mins*60*1000 - Math.max(0, mock.end-Date.now()))/6e4);
  renderMock(); window.scrollTo({top:0});
}
function resultBox(){
  const mcPts = mock.cfg.pts;
  const right = mock.items.filter(({q})=>mock.picks[q.id]===q.a).length;
  const key = q => mock.kind==='mix' ? THEMENAME[themeOf(q)]+' · '+BYID[q.course].code : chName(q.course, q.ch);
  const by = {}; mock.items.forEach(({q})=>{ const k=key(q); by[k]=by[k]||[0,0]; by[k][1]++; if(mock.picks[q.id]===q.a) by[k][0]++; });
  let saGot = 0, saMax = 0;
  mock.sas.forEach((s,k)=>{ saMax += s.pts; const n = s.rub.filter((r,j)=>mock.rub[k+'-'+j]).length; saGot += s.pts*n/s.rub.length; });
  const total = right*mcPts + saGot, max = mock.items.length*mcPts + saMax;
  return `<div class="result" id="res"><div class="big">${Math.round(total*10)/10} / ${max}</div><p>Multiple choice ${right}/${mock.items.length} (${right*mcPts} pts)${mock.sas.length?` · written ${Math.round(saGot*10)/10}/${saMax} from your rubric ticks below`:''}${mock.usedMin!=null?` · ${mock.usedMin} min used`:''}.</p>
  <table><tr><th>${mock.kind==='mix'?'Topic · exam':'Chapter'}</th><th>Right</th></tr>${Object.entries(by).sort().map(([c,v])=>`<tr><td>${esc(c)}</td><td>${v[0]}/${v[1]}</td></tr>`).join('')}</table>
  <p class="src">Misses are saved, so Practice → “My misses” replays them.</p></div>`;
}

readHash(); render();
})();

</script>
